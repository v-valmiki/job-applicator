name: poll-simplify
on:
  schedule:
    - cron: "5,35 * * * *"   # ~4 min after Simplify's :01/:31 batches
  workflow_dispatch:
permissions:
  contents: write
jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/poll.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      - name: Commit state
        run: |
          git config user.name "poll-bot"
          git config user.email "poll-bot@users.noreply.github.com"
          git add state queue.md
          git diff --cached --quiet || (git commit -m "Update state" && git push)
